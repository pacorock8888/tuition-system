<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巨石玩理 ｜ 線上報名</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      padding: 32px 16px 48px;
    }

    .container { max-width: 560px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }
    header .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #8e8e93; text-transform: uppercase; margin-bottom: 6px; }
    header h1 { font-size: 24px; font-weight: 700; color: #1c1c1e; }
    header p { font-size: 14px; color: #6c6c70; margin-top: 8px; line-height: 1.6; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8e8e93;
      margin: 24px 0 16px;
    }
    .section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 16px; }

    label { display: block; font-size: 13px; font-weight: 600; color: #3a3a3c; margin-bottom: 6px; }
    label .req { color: #ff3b30; margin-left: 2px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1c1c1e;
      background: #fff;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #007aff; }
    input::placeholder, textarea::placeholder { color: #c7c7cc; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    .hint { font-size: 12px; color: #8e8e93; margin-top: 4px; }
    .divider { height: 1px; background: #f2f2f7; margin: 20px 0; }

    /* 預設方案顯示 */
    .preset-chip {
      background: #f0f6ff;
      border: 1.5px solid #007aff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #007aff;
    }

    .terms-box { margin-top:24px; padding:20px; border:1px solid #dce5ef; border-radius:12px; background:#f8faff; }
    .terms-box h2 { font-size:17px; margin-bottom:8px; }
    .terms-box ul { padding-left:20px; margin-bottom:14px; }
    .terms-box li { font-size:14px; line-height:1.8; color:#3a3a3c; margin-bottom:7px; }
    .terms-box .refund-heading { border-top:1px solid #dce5ef; padding-top:20px; margin-top:20px; }
    .terms-box h3 { font-size:14px; margin:16px 0 8px; }
    .terms-box p { font-size:14px; line-height:1.8; color:#3a3a3c; margin-bottom:10px; }
    .terms-box .terms-intro { color:#6c6c70; font-size:13px; }
    .terms-consent { display:flex; align-items:flex-start; gap:10px; margin:16px 0 0; padding-top:16px; border-top:1px solid #dce5ef; cursor:pointer; font-size:14px; line-height:1.7; }
    .terms-consent input { width:20px; height:20px; flex-shrink:0; margin-top:2px; accent-color:#007aff; cursor:pointer; }
    .terms-consent input:focus-visible { outline:2px solid #007aff; outline-offset:3px; }
    .submit-hint { text-align:center; font-size:12px; color:#6c6c70; margin-top:8px; }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-banner {
      display: none;
      background: #fff1f0;
      border: 1px solid #ffccc7;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #cf1322;
      margin-top: 12px;
    }

    .success-view { display: none; text-align: center; padding: 40px 24px; }
    .success-icon { font-size: 56px; line-height: 1; margin-bottom: 16px; }
    .success-view h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .success-view p { font-size: 14px; color: #6c6c70; line-height: 1.7; }

    footer { text-align: center; margin-top: 20px; font-size: 12px; color: #c7c7cc; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">巨石玩理</div>
    <h1>線上課程報名</h1>
    <p>填寫完成後，PACO 老師會透過 LINE 與您聯繫，確認課程安排與繳費方式。</p>
  </header>

  <div class="card">
    <form id="regForm">

      <div class="section-title">學生資料</div>

      <div class="field">
        <label>學生姓名 <span class="req">*</span></label>
        <input type="text" name="student_name" placeholder="請填寫學生全名（例：王小明）" required>
        <div class="hint">⚠️ 請務必填寫完整全名，勿只填名字</div>
      </div>

      <div class="field">
        <label>就讀學校 <span class="req">*</span></label>
        <input type="text" name="school" placeholder="例：○○國中" required>
      </div>

      <div class="divider"></div>
      <div class="section-title">聯絡資料</div>

      <div class="field">
        <label>家長姓名 <span class="req">*</span></label>
        <input type="text" name="parent_name" placeholder="請填寫家長全名（例：王大明）" required>
        <div class="hint">⚠️ 請務必填寫完整全名</div>
      </div>

      <div class="field">
        <label>家長電話 <span class="req">*</span></label>
        <input type="text" name="phone" placeholder="例：0912345678" required>
      </div>

      <div class="field">
        <label>LINE ID（選填）</label>
        <input type="text" name="line_id" placeholder="例：yourlineID">
      </div>

      <div class="field">
        <label>居住地址 <span class="req">*</span></label>
        <input type="text" name="address" placeholder="縣市區路號" required>
      </div>

      <div class="divider"></div>
      <div class="section-title">課程選擇</div>

      <div class="field" id="planField">
        <!-- 由 JS 動態填入 -->
      </div>

      <div class="field">
        <label>備註（選填）</label>
        <textarea name="notes" placeholder="任何補充說明，例如：希望的上課時段、先前學習狀況等"></textarea>
      </div>

      <section class="terms-box" aria-labelledby="termsTitle">
        <h2 id="termsTitle">報名前須知</h2>
        <p class="terms-intro">請家長閱讀以下說明，確認了解後再送出報名。</p>
        <h3 id="rulesTitle"></h3>
        <div id="termsRules"></div>
        <h3 id="refundTitle" class="refund-heading">退費方式</h3>
        <div id="termsContent"></div>
        <label class="terms-consent" for="termsAccepted">
          <input type="checkbox" id="termsAccepted" required>
          <span id="termsAcknowledgement"></span>
        </label>
      </section>

      <div id="errorBanner" class="error-banner">送出失敗，請重試或直接聯繫 PACO 老師。</div>
      <button type="submit" class="submit-btn" id="submitBtn" disabled aria-describedby="submitHint">送出報名</button>
      <p id="submitHint" class="submit-hint">請先勾選已閱讀報名須知，再送出報名。</p>
    </form>

    <div class="success-view" id="successView">
      <div class="success-icon">✅</div>
      <h2>報名成功！</h2>
      <p>PACO 老師已收到您的報名資訊。<br>將盡快透過 LINE 聯繫您確認課程安排。</p>
    </div>
  </div>

  <footer>巨石玩理 · PACO 老師線上理化課程</footer>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7D_7xj3xe3S_ejL58oOGO2AMc70gMXBAtgbnkmrKqsPL3KxMaz9IlyFk6jMPyBjKRmQ/exec';

  const REGISTRATION_TERMS = {"version":"2026-09-19-v2","title":"報名前須知","refundTitle":"退費方式","paragraphs":["上課滿一個月後，若覺得課程不適應，可申請退還剩餘未上課月份學費的 70%。","本說明不影響依法享有的退費權益。"],"acknowledgement":"我已閱讀並了解上述班級規則與退費方式。","rulesTitle":"Paco 線上班級規則","rules":[{"title":"每週安排","items":["週一：發佈懶人包。","週二：發佈作業解析、小考與小考解析。","週六上課前一小時：將訂正完成的作業與小考繳交至 Classroom。"]},{"title":"新同學兩週適應期","items":["前兩週不用繳交作業與小考。","請利用這段時間盡快看完過去的課程影片，練習以講義題目為主。"]},{"title":"作業與小考","items":["請保留作答過程。只填 ABCD、沒有作答痕跡，會退件並視同未繳。","繳交前請完成訂正，用自己理解的方式寫下解題過程，不要照抄解析。","如有生病或其他特殊狀況，請填寫假單。"]},{"title":"請假與補課","items":["無法上課時，請提前私訊老師請假。","請在下次上課前完成補課、作業與小考；新同學適應期內依上述規則辦理。"]},{"title":"課堂與班級約定","items":["課程以互動為主，請同學主動參與。上課時不檢討作業與考卷。","成績表現優異的同學會有獎勵。","班內資源禁止外流，群內禁止謾罵與批評。"]},{"title":"給同學的話","paragraphs":["有規則，才有自由；有界線，才有成長。你願意努力，我就會全力陪你走下去。"]}]};

  // 讀取 URL 參數
  const params = new URLSearchParams(window.location.search);
  const yearParam  = params.get('year')  || '';
  const planParam  = params.get('plan')  || '';

  // 課程方案欄位：有帶參數就鎖定，否則讓學生自填
  const planField = document.getElementById('planField');
  if (planParam) {
    const label = document.createElement('label');
    label.textContent = '課程方案';
    const chip = document.createElement('div'); chip.className = 'preset-chip';
    const matched = planParam.match(/^(四個月|六個月)(\d+)$/);
    chip.textContent = matched ? `${matched[1] === '四個月' ? 4 : 6} 個月｜$${Number(matched[2]).toLocaleString()}` : planParam;
    const hidden = document.createElement('input'); hidden.type = 'hidden'; hidden.name = 'course_type'; hidden.value = planParam;
    const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '課程方案由老師預先設定';
    planField.replaceChildren(label, chip, hidden, hint);
  } else {
    planField.innerHTML = `
      <label>課程方案 <span class="req">*</span></label>
      <input type="text" name="course_type" placeholder="請填寫課程方案（由老師告知）" required>
    `;
  }

  document.getElementById('termsTitle').textContent = REGISTRATION_TERMS.title;
  document.getElementById('rulesTitle').textContent = REGISTRATION_TERMS.rulesTitle;
  for (const section of REGISTRATION_TERMS.rules) {
    const heading = document.createElement('h3'); heading.textContent = section.title;
    document.getElementById('termsRules').appendChild(heading);
    if (section.items) {
      const list = document.createElement('ul');
      for (const text of section.items) { const item = document.createElement('li'); item.textContent = text; list.appendChild(item); }
      document.getElementById('termsRules').appendChild(list);
    }
    for (const text of section.paragraphs || []) { const paragraph = document.createElement('p'); paragraph.textContent = text; document.getElementById('termsRules').appendChild(paragraph); }
  }
  document.getElementById('refundTitle').textContent = REGISTRATION_TERMS.refundTitle;
  for (const text of REGISTRATION_TERMS.paragraphs) {
    const paragraph = document.createElement('p'); paragraph.textContent = text;
    document.getElementById('termsContent').appendChild(paragraph);
  }
  document.getElementById('termsAcknowledgement').textContent = REGISTRATION_TERMS.acknowledgement;
  const consent = document.getElementById('termsAccepted');
  const submitBtn = document.getElementById('submitBtn');
  let submitting = false, pendingRegistration = null;
  consent.addEventListener('change', () => {
    submitBtn.disabled = submitting || !consent.checked;
    document.getElementById('submitHint').textContent = consent.checked ? '' : '請先勾選已閱讀報名須知，再送出報名。';
  });
  document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (submitting) return;
    if (!consent.checked) { consent.reportValidity(); return; }
    if (!this.reportValidity()) return;
    const errorBanner = document.getElementById('errorBanner');
    submitting = true; submitBtn.disabled = true; submitBtn.textContent = '送出中…';
    errorBanner.style.display = 'none';
    const raw = new FormData(this);
    const payload = { tuition_year: yearParam || '116' };
    raw.forEach((val, key) => { payload[key] = val.trim ? val.trim() : val; });
    payload.terms_accepted = true;
    payload.terms_version = REGISTRATION_TERMS.version;
    const fingerprint = JSON.stringify(payload);
    if (!pendingRegistration || pendingRegistration.fingerprint !== fingerprint) {
      pendingRegistration = {fingerprint, requestId:crypto.randomUUID(), submittedAt:new Date().toISOString()};
    }
    payload.registration_id = pendingRegistration.requestId;
    payload.submitted_at = pendingRegistration.submittedAt;
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('連線失敗，請稍後重試。');
      const result = await response.json();
      if (result.status !== 'success') throw new Error(result.message || '報名未完成，請重試。');
      document.getElementById('regForm').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (err) {
      errorBanner.textContent = '尚未確認報名成功：' + (err.message || '連線失敗') + ' 已保留填寫內容；若仍無法送出，請聯繫 PACO 老師。';
      errorBanner.style.display = 'block';
    } finally {
      submitting = false; submitBtn.disabled = !consent.checked; submitBtn.textContent = '送出報名';
    }
  });
</script>

</body>
</html>
