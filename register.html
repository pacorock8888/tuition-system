<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巨石玩理 ｜ 線上報名</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'PingFang TC', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      padding: 32px 16px 48px;
    }

    .container { max-width: 560px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 28px; }
    header .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #8e8e93; text-transform: uppercase; margin-bottom: 6px; }
    header h1 { font-size: 24px; font-weight: 700; color: #1c1c1e; }
    header p { font-size: 14px; color: #6c6c70; margin-top: 8px; line-height: 1.6; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8e8e93;
      margin: 24px 0 16px;
    }
    .section-title:first-child { margin-top: 0; }

    .field { margin-bottom: 16px; }

    label { display: block; font-size: 13px; font-weight: 600; color: #3a3a3c; margin-bottom: 6px; }
    label .req { color: #ff3b30; margin-left: 2px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1c1c1e;
      background: #fff;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #007aff; }
    input::placeholder, textarea::placeholder { color: #c7c7cc; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    .hint { font-size: 12px; color: #8e8e93; margin-top: 4px; }
    .divider { height: 1px; background: #f2f2f7; margin: 20px 0; }

    /* 預設方案顯示 */
    .preset-chip {
      background: #f0f6ff;
      border: 1.5px solid #007aff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      color: #007aff;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-banner {
      display: none;
      background: #fff1f0;
      border: 1px solid #ffccc7;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #cf1322;
      margin-top: 12px;
    }

    .success-view { display: none; text-align: center; padding: 40px 24px; }
    .success-icon { font-size: 56px; line-height: 1; margin-bottom: 16px; }
    .success-view h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .success-view p { font-size: 14px; color: #6c6c70; line-height: 1.7; }

    footer { text-align: center; margin-top: 20px; font-size: 12px; color: #c7c7cc; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">巨石玩理</div>
    <h1>線上課程報名</h1>
    <p>填寫完成後，PACO 老師會透過 LINE 與您聯繫，確認課程安排與繳費方式。</p>
  </header>

  <div class="card">
    <form id="regForm">

      <div class="section-title">學生資料</div>

      <div class="field">
        <label>學生姓名 <span class="req">*</span></label>
        <input type="text" name="student_name" placeholder="請填寫學生全名（例：王小明）" required>
        <div class="hint">⚠️ 請務必填寫完整全名，勿只填名字</div>
      </div>

      <div class="field">
        <label>就讀學校 <span class="req">*</span></label>
        <input type="text" name="school" placeholder="例：○○國中" required>
      </div>

      <div class="divider"></div>
      <div class="section-title">聯絡資料</div>

      <div class="field">
        <label>家長姓名 <span class="req">*</span></label>
        <input type="text" name="parent_name" placeholder="請填寫家長全名（例：王大明）" required>
        <div class="hint">⚠️ 請務必填寫完整全名</div>
      </div>

      <div class="field">
        <label>家長聯絡方式（電話 / LINE ID）<span class="req">*</span></label>
        <input type="text" name="phone" placeholder="電話號碼或 LINE ID" required>
        <div class="hint">填其中一個即可，或兩個都填（例：0912345678 / lineID）</div>
      </div>

      <div class="field">
        <label>居住地址 <span class="req">*</span></label>
        <input type="text" name="address" placeholder="縣市區路號" required>
      </div>

      <div class="divider"></div>
      <div class="section-title">課程選擇</div>

      <div class="field" id="planField">
        <!-- 由 JS 動態填入 -->
      </div>

      <div class="field">
        <label>備註（選填）</label>
        <textarea name="notes" placeholder="任何補充說明，例如：希望的上課時段、先前學習狀況等"></textarea>
      </div>

      <div id="errorBanner" class="error-banner">送出失敗，請重試或直接聯繫 PACO 老師。</div>
      <button type="submit" class="submit-btn" id="submitBtn">送出報名</button>
    </form>

    <div class="success-view" id="successView">
      <div class="success-icon">✅</div>
      <h2>報名成功！</h2>
      <p>PACO 老師已收到您的報名資訊。<br>將盡快透過 LINE 聯繫您確認課程安排。</p>
    </div>
  </div>

  <footer>巨石玩理 · PACO 老師線上理化課程</footer>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7D_7xj3xe3S_ejL58oOGO2AMc70gMXBAtgbnkmrKqsPL3KxMaz9IlyFk6jMPyBjKRmQ/exec';

  // 讀取 URL 參數
  const params = new URLSearchParams(window.location.search);
  const yearParam  = params.get('year')  || '';
  const planParam  = params.get('plan')  || '';

  // 課程方案欄位：有帶參數就鎖定，否則讓學生自填
  const planField = document.getElementById('planField');
  if (planParam) {
    planField.innerHTML = `
      <label>課程方案</label>
      <div class="preset-chip">${planParam}</div>
      <input type="hidden" name="course_type" value="${planParam}">
      <div class="hint">課程方案由老師預先設定</div>
    `;
  } else {
    planField.innerHTML = `
      <label>課程方案 <span class="req">*</span></label>
      <input type="text" name="course_type" placeholder="請填寫課程方案（由老師告知）" required>
    `;
  }

  document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const errorBanner = document.getElementById('errorBanner');
    btn.disabled = true;
    btn.textContent = '送出中…';
    errorBanner.style.display = 'none';

    const raw = new FormData(this);
    const payload = { tuition_year: yearParam || '116' };
    raw.forEach((val, key) => { payload[key] = val.trim ? val.trim() : val; });
    payload.submitted_at = new Date().toISOString();

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('regForm').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch (err) {
      errorBanner.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送出報名';
    }
  });
</script>

</body>
</html>
