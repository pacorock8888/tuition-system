<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巨石玩理 ｜ 學費管理</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif;
      background: #f2f2f7; color: #1c1c1e; min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: #1c1c1e; color: white; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar h1  { font-size: 18px; font-weight: 700; }
    .topbar .sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
    .year-tabs  { display: flex; gap: 6px; }
    .year-tab {
      padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; background: #3a3a3c; color: #ebebf5; border: none;
    }
    .year-tab.active { background: #007aff; color: white; }

    /* ── Stats ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; padding: 16px 20px;
    }
    .stat-card { background: white; border-radius: 14px; padding: 14px; text-align: center; }
    .stat-num  { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 13px; color: #8e8e93; margin-top: 5px; }
    .stat-card.total   .stat-num { color: #1c1c1e; }
    .stat-card.paid    .stat-num { color: #34c759; }
    .stat-card.unpaid  .stat-num { color: #ff3b30; }
    .stat-card.expiring .stat-num { color: #ff9500; }

    /* ── Filter ── */
    .filter-row {
      padding: 0 20px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .filter-row input {
      flex: 1; min-width: 160px; padding: 9px 14px;
      border: 1.5px solid #e5e5ea; border-radius: 10px;
      font-size: 14px; font-family: inherit; background: white;
    }
    .filter-row input:focus { outline: none; border-color: #007aff; }
    .filter-btn {
      padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1.5px solid #e5e5ea; background: white; color: #3a3a3c;
    }
    .filter-btn.active { background: #007aff; color: white; border-color: #007aff; }
    .import-btn {
      padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1.5px solid #e5e5ea; background: #1c1c1e; color: white;
      margin-left: auto;
    }

    /* ── Tile Grid ── */
    .tile-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px; padding: 0 20px 40px;
    }
    .tile {
      background: white; border-radius: 10px; padding: 12px 8px 10px;
      text-align: center; cursor: pointer;
      border-top: 3px solid #c7c7cc;
      transition: transform 0.1s, box-shadow 0.1s; user-select: none;
    }
    .tile:hover  { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
    .tile:active { transform: none; box-shadow: none; }
    .tile.status-paid     { border-top-color: #34c759; }
    .tile.status-unpaid   { border-top-color: #ff3b30; }
    .tile.status-expiring { border-top-color: #ff9500; }
    .tile.status-pending  { border-top-color: #c7c7cc; }
    .tile.status-inactive { border-top-color: #e5e5ea; opacity: 0.5; }
    .tile-name { font-size: 16px; font-weight: 700; }
    .tile-tag  {
      display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 10px;
    }
    .tile-tag.paid     { background: #d1f5d9; color: #1a7a2e; }
    .tile-tag.unpaid   { background: #ffe4e4; color: #c0392b; }
    .tile-tag.expiring { background: #fff3d9; color: #b06000; }
    .tile-tag.pending  { background: #f2f2f7; color: #6c6c70; }
    .tile-tag.inactive { background: #f2f2f7; color: #8e8e93; }
    .tile-days { font-size: 10px; color: #8e8e93; margin-top: 3px; }
    .tile-days.soon    { color: #ff9500; font-weight: 700; }
    .tile-days.expired { color: #ff3b30; }

    .loading { text-align: center; padding: 60px 20px; color: #8e8e93; font-size: 15px; grid-column: 1/-1; }
    #mainView { display: none; }

    /* ── Detail Panel ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 200;
    }
    .overlay.show { display: block; }

    .detail-panel {
      position: fixed; top: 0; right: -420px; width: 420px; max-width: 100vw;
      height: 100%; background: white;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
      z-index: 300; display: flex; flex-direction: column;
      transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .detail-panel.open { right: 0; }

    .panel-header {
      padding: 16px 20px; display: flex; justify-content: space-between;
      align-items: flex-start; border-bottom: 1px solid #f2f2f7; flex-shrink: 0;
    }
    .panel-name   { font-size: 22px; font-weight: 700; }
    .panel-school { font-size: 14px; color: #6c6c70; margin-top: 3px; }
    .panel-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 10px; }

    .close-btn {
      background: #f2f2f7; border: none; border-radius: 50%;
      width: 30px; height: 30px; font-size: 14px; cursor: pointer;
    }

    .panel-scroll { flex: 1; overflow-y: auto; padding: 0 20px 40px; }

    .panel-section { padding: 16px 0; border-bottom: 1px solid #f2f2f7; }
    .panel-section:last-child { border-bottom: none; }

    .section-title {
      font-size: 11px; font-weight: 700; color: #8e8e93;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
    }

    .info-row { display: flex; gap: 8px; margin-bottom: 7px; font-size: 15px; align-items: flex-start; }
    .info-icon { width: 22px; flex-shrink: 0; margin-top: 1px; }
    .info-val  { line-height: 1.45; word-break: break-all; }

    .period-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .period-lbl  { font-size: 14px; color: #6c6c70; }
    .period-val  { font-size: 15px; font-weight: 600; }

    .status-badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-paid     { background: #d1f5d9; color: #1a7a2e; }
    .badge-unpaid   { background: #ffe4e4; color: #c0392b; }
    .badge-expiring { background: #fff3d9; color: #b06000; }
    .badge-pending  { background: #f2f2f7; color: #6c6c70; }
    .badge-inactive { background: #f2f2f7; color: #8e8e93; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .panel-btn {
      flex: 1; min-width: 80px; padding: 10px 6px;
      border-radius: 10px; border: none; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: opacity 0.15s;
    }
    .panel-btn:hover   { opacity: 0.8; }
    .panel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-green { background: #34c759; color: white; }
    .btn-blue  { background: #007aff; color: white; }
    .btn-gray  { background: #f2f2f7; color: #3a3a3c; }
    .btn-red   { background: #ff3b30; color: white; }
    .btn-orange { background: #ff9500; color: white; }

    .sub-form { margin-top: 14px; background: #f8f8f8; border-radius: 12px; padding: 14px; }
    .sub-form.hidden { display: none; }

    .form-field { margin-bottom: 12px; }
    .form-field label { display: block; font-size: 12px; font-weight: 600; color: #6c6c70; margin-bottom: 5px; }
    .form-field input,
    .form-field select {
      width: 100%; padding: 9px 12px; border: 1.5px solid #e5e5ea; border-radius: 8px;
      font-size: 14px; font-family: inherit; background: white;
      -webkit-appearance: none; appearance: none;
    }
    .form-field input:focus,
    .form-field select:focus { outline: none; border-color: #007aff; }

    .save-btn {
      width: 100%; padding: 11px; background: #007aff; color: white;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px; font-family: inherit;
    }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hist-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #f2f2f7; font-size: 14px;
    }
    .hist-row:last-child { border-bottom: none; }
    .hist-date { color: #3a3a3c; font-weight: 600; }
    .hist-plan { color: #6c6c70; font-size: 12px; margin-top: 1px; }
    .hist-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .scholarship-earn { color: #34c759; font-weight: 700; font-size: 14px; }
    .scholarship-big  { font-size: 18px; font-weight: 700; color: #34c759; }

    /* ── Import Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 400;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: white; border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px; width: 100%; max-width: 600px; max-height: 85vh;
      display: flex; flex-direction: column;
    }
    .modal-title {
      font-size: 18px; font-weight: 700; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .modal-title button {
      background: #f2f2f7; border: none; border-radius: 50%;
      width: 30px; height: 30px; font-size: 14px; cursor: pointer;
    }
    .modal-scroll { flex: 1; overflow-y: auto; }
    .preview-table-wrap { overflow-x: auto; border: 1px solid #e5e5ea; border-radius: 10px; max-height: 220px; overflow-y: auto; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .preview-table th { background: #f8f8f8; padding: 7px 10px; text-align: left; font-weight: 600; font-size: 12px; color: #6c6c70; white-space: nowrap; }
    .preview-table td { padding: 7px 10px; border-top: 1px solid #f2f2f7; }
    .preview-table tr.no-match td { background: #fff8f8; }
    .match-ok  { color: #34c759; font-weight: 700; }
    .match-err { color: #ff3b30; font-weight: 700; }

    /* ── Course Tab Switcher ── */
    .course-tabs-bar {
      background: white; padding: 0 20px;
      display: flex; gap: 4px; border-bottom: 2px solid #f2f2f7;
    }
    .ctab {
      padding: 10px 18px; font-size: 14px; font-weight: 700;
      border: none; cursor: pointer; background: none; color: #8e8e93;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      font-family: inherit;
    }
    .ctab.active { color: #007aff; border-bottom-color: #007aff; }

    /* ── Review tile badges ── */
    .tile-class-badge {
      display: inline-block; margin-top: 4px; font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 8px;
    }
    .class-bio { background: #d1f5d9; color: #1a7a2e; }
    .class-phy { background: #dbeafe; color: #1d4ed8; }

    /* ── Mode-based show/hide ── */
    .detail-panel.review-mode .main-only { display: none !important; }
    .detail-panel.main-mode  .review-only { display: none !important; }

    /* ── RWD ── */
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .stat-num  { font-size: 24px; }
      .tile-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); padding: 0 12px 40px; }
      .detail-panel { width: 100%; right: auto; bottom: -92vh; top: auto; height: 92vh; border-radius: 20px 20px 0 0; transition: bottom 0.28s cubic-bezier(0.4,0,0.2,1); }
      .detail-panel.open { bottom: 0; }
      .modal-overlay { align-items: flex-end; }
    }
    @media (min-width: 601px) {
      .modal-overlay { align-items: center; }
      .modal-box { border-radius: 20px; }
    }
  </style>
</head>
<body>

<div id="mainView">
  <div class="topbar">
    <div>
      <div class="sub">巨石玩理管理後台</div>
      <h1>學費管理</h1>
    </div>
    <div class="year-tabs" id="yearTabs"></div>
  </div>

  <!-- 課程分頁 -->
  <div class="course-tabs-bar">
    <button class="ctab active" id="ctabMain"   onclick="switchCourseTab('main')">📅 進度班</button>
    <button class="ctab"        id="ctabReview" onclick="switchCourseTab('review')">🌿 複習班</button>
  </div>

  <!-- 進度班 view -->
  <div id="mainCourseView">
    <div class="stats-row">
      <div class="stat-card total">   <div class="stat-num" id="statTotal">—</div>   <div class="stat-label">總學生數</div></div>
      <div class="stat-card paid">    <div class="stat-num" id="statPaid">—</div>    <div class="stat-label">已繳費</div></div>
      <div class="stat-card unpaid">  <div class="stat-num" id="statUnpaid">—</div>  <div class="stat-label">未繳費</div></div>
      <div class="stat-card expiring"><div class="stat-num" id="statExpiring">—</div><div class="stat-label">即將到期</div></div>
    </div>
    <div class="filter-row">
      <input type="text" id="searchInput" placeholder="搜尋姓名、學校…" oninput="renderGrid()">
      <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
      <button class="filter-btn"       onclick="setFilter('unpaid',this)">未繳</button>
      <button class="filter-btn"       onclick="setFilter('expiring',this)">即將到期</button>
      <button class="filter-btn"       onclick="setFilter('paid',this)">已繳</button>
      <button class="filter-btn"       onclick="setFilter('inactive',this)">不續班</button>
      <button class="import-btn"       onclick="openImportModal()">📥 匯入成績</button>
    </div>
    <div class="tile-grid" id="tileGrid"><div class="loading">載入中…</div></div>
  </div>

  <!-- 複習班 view -->
  <div id="reviewCourseView" style="display:none">
    <div class="stats-row">
      <div class="stat-card total">  <div class="stat-num" id="rStatTotal">—</div>  <div class="stat-label">報名人次</div></div>
      <div class="stat-card paid">   <div class="stat-num" id="rStatPaid">—</div>   <div class="stat-label">已繳費</div></div>
      <div class="stat-card unpaid"> <div class="stat-num" id="rStatUnpaid">—</div> <div class="stat-label">未繳費</div></div>
      <div class="stat-card expiring"><div class="stat-num" id="rStatBio">—</div>   <div class="stat-label">生物複習</div></div>
    </div>
    <div class="filter-row">
      <input type="text" id="reviewSearchInput" placeholder="搜尋姓名…" oninput="renderReviewGrid()">
      <button class="filter-btn active" onclick="setReviewFilter('all',this)">全部</button>
      <button class="filter-btn"       onclick="setReviewFilter('unpaid',this)">未繳</button>
      <button class="filter-btn"       onclick="setReviewFilter('paid',this)">已繳</button>
      <button class="filter-btn"       onclick="setReviewFilter('inactive',this)">不續班</button>
      <button class="filter-btn"       onclick="setReviewFilter('bio',this)">🌿 生物</button>
      <button class="filter-btn"       onclick="setReviewFilter('phy',this)">⚗️ 理化</button>
    </div>
    <div class="tile-grid" id="reviewTileGrid"><div class="loading">點選「複習班」分頁後載入</div></div>
  </div>

</div>

<!-- Detail Panel -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>

<div class="detail-panel" id="detailPanel">
  <div class="panel-header">
    <div>
      <div class="panel-name" id="pName"></div>
      <div class="panel-school" id="pSchool"></div>
    </div>
    <div class="panel-header-right">
      <span class="status-badge" id="pBadge"></span>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
  </div>

  <div class="panel-scroll">

    <!-- 聯絡資料 -->
    <div class="panel-section">
      <div class="section-title">聯絡資料</div>
      <div class="info-row"><span class="info-icon">📱</span><span class="info-val" id="pPhone"></span></div>
      <div class="info-row"><span class="info-icon">🏠</span><span class="info-val" id="pAddress"></span></div>
      <div class="info-row"><span class="info-icon">💬</span><span class="info-val" id="pLine"></span></div>
    </div>

    <!-- 本期資料（進度班）-->
    <div class="panel-section main-only">
      <div class="section-title">本期資料</div>
      <div class="period-item">
        <span class="period-lbl">課程方案</span>
        <span class="period-val" id="pPlan"></span>
      </div>
      <div class="period-item">
        <span class="period-lbl">課程期間</span>
        <span class="period-val" id="pDateRange"></span>
      </div>
    </div>

    <!-- 本期資料（複習班）-->
    <div class="panel-section review-only">
      <div class="section-title">複習班資料</div>
      <div class="period-item">
        <span class="period-lbl">班別</span>
        <span class="period-val" id="rClass"></span>
      </div>
      <div class="period-item">
        <span class="period-lbl">身份</span>
        <span class="period-val" id="rMember"></span>
      </div>
      <div class="period-item">
        <span class="period-lbl">費用</span>
        <span class="period-val" id="rFee"></span>
      </div>
      <div class="period-item">
        <span class="period-lbl">課程期間</span>
        <span class="period-val" id="rDateRange"></span>
      </div>
    </div>

    <!-- 成績與獎學金（進度班專屬）-->
    <div class="panel-section main-only">
      <div class="section-title">成績與獎學金</div>
      <div class="period-item" style="margin-bottom:12px">
        <span class="period-lbl">可用獎學金</span>
        <span class="scholarship-big" id="pScholarship">—</span>
      </div>
      <div class="action-row" style="margin-bottom:0">
        <button class="panel-btn btn-blue"   onclick="toggleForm('scoreForm')">📝 輸入成績</button>
        <button class="panel-btn btn-orange" onclick="doCashOut()">💵 領現金</button>
      </div>

      <!-- 輸入成績表單 -->
      <div id="scoreForm" class="sub-form hidden">
        <div class="form-field">
          <label>考試名稱</label>
          <input type="text" id="scoreExamName" placeholder="例：二下二段考">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="form-field">
            <label>前次成績（選填）</label>
            <input type="number" id="scorePrev" placeholder="上次幾分" min="0" max="100" oninput="previewScholarship()">
          </div>
          <div class="form-field">
            <label>當次成績 <span style="color:#ff3b30">*</span></label>
            <input type="number" id="scoreCurrent" placeholder="這次幾分" min="0" max="100" oninput="previewScholarship()">
          </div>
        </div>
        <div id="scholarshipPreview" style="display:none;color:#34c759;font-size:13px;font-weight:700;margin-bottom:8px;background:#f0fff4;padding:8px 10px;border-radius:8px"></div>
        <button class="save-btn" id="scoreSubmit" onclick="doAddScore()">確認新增</button>
      </div>

      <!-- 成績紀錄 -->
      <div id="scoreHistory" style="margin-top:12px"></div>
    </div>

    <!-- 操作 -->
    <div class="panel-section">
      <div class="section-title">操作</div>
      <div class="action-row">
        <button class="panel-btn btn-green" onclick="toggleForm('payForm')">✅ 記錄繳費</button>
        <button class="panel-btn btn-blue main-only"  onclick="toggleForm('renewForm')">🔄 更新學期</button>
        <button class="panel-btn btn-gray"  onclick="handleInactive()">🚫 不續班</button>
      </div>

      <!-- 記錄繳費 -->
      <div id="payForm" class="sub-form hidden">
        <div class="form-field">
          <label>繳費日期</label>
          <input type="date" id="payDate">
        </div>
        <div class="form-field">
          <label>學費金額（元）</label>
          <input type="number" id="payAmount" placeholder="例：9000" oninput="updateNetAmount()">
        </div>
        <div class="form-field main-only" id="scholarshipRow" style="display:none">
          <label>獎學金折抵（可用 <span id="payScholarshipAvail" style="color:#34c759;font-weight:700">0</span> 元）</label>
          <input type="number" id="payDeduction" placeholder="0" min="0" oninput="updateNetAmount()">
        </div>
        <div id="netAmountDisplay" style="font-size:14px;margin-bottom:10px;display:none;color:#3a3a3c">
          實際收款：<strong id="netAmount" style="color:#007aff;font-size:16px">$0</strong>
        </div>
        <button class="save-btn" id="paySubmit" onclick="doRecordPayment()">確認已繳費</button>
      </div>

      <!-- 更新學期 -->
      <div id="renewForm" class="sub-form hidden main-only">
        <div class="form-field">
          <label>課程方案</label>
          <select id="renewPlan" onchange="onPlanChange()">
            <option value="四個月9000">四個月｜$9,000</option>
            <option value="四個月9500">四個月｜$9,500</option>
            <option value="四個月10000">四個月｜$10,000</option>
            <option value="六個月13500">六個月｜$13,500</option>
            <option value="六個月14400">六個月｜$14,400</option>

          <div class="form-field">
            <label>開始月份</label>
            <input type="month" id="renewStart" oninput="calcRenewEnd()">
          </div>
          <div class="form-field">
            <label>結束月份</label>
            <input type="month" id="renewEnd">

        </div>
        <button class="save-btn" id="renewSubmit" onclick="doUpdatePeriod()">儲存學期</button>
      </div>

    <!-- 繳費紀錄 -->
    <div class="panel-section">
      <div class="section-title">繳費紀錄</div>
      <div id="payHistory"><div style="color:#8e8e93;font-size:13px">載入中…</div></div>
    </div>

  </div>
</div>

  <div class="modal-box">

      <button onclick="closeImportModal()">✕</button>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyh7gL_upYsyoKjvEGywwqMLHOig7N3puMIrVM15TonXg_LpR9fcsfwQrBSBCGU60Ju/exec';

  let allStudents          = [];
  let currentYear          = '';
  let currentFilter        = 'all';
  let currentStudentId     = null;
  let currentScholarship   = 0;
  let _importRows          = [];
  const adminToken         = 'paco2024';

  // 複習班
  let allReviewStudents    = [];
  let currentReviewFilter  = 'all';
  let currentReviewId      = null;
  let reviewLoaded         = false;
  let currentTab           = 'main'; // 'main' | 'review'

  // ── 日期格式化 ──
  function fmtYM(val) {
    if (!val) return '—';
    const d = new Date(val);
    if (isNaN(d)) return String(val).slice(0, 7).replace('-', '/');
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // ── 剩餘天數 ──
  // endVal 可能是 "2026-06"（YYYY-MM）或 "2026-06-01T..."（Sheets 轉的 ISO 字串）
  // 一律取該月最後一天
  function daysLeft(endVal) {
    if (!endVal) return null;
    const s = String(endVal);
    let y, m;
    if (/^\d{4}-\d{2}$/.test(s)) {
      [y, m] = s.split('-').map(Number);
    } else if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
      // ISO date string：只取 YYYY-MM 部分
      [y, m] = s.substring(0, 7).split('-').map(Number);
    } else {
      return null;
    }
    const endDate = new Date(y, m, 0); // last day of month m (JS month is 0-indexed)
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.ceil((endDate - today) / 86400000);
  }

  // ── 繳費狀態 ──
  function getStatus(s) {
    const raw = s['繳費狀態'] || '待確認';
    if (raw === '不續班') return 'inactive';
    if (raw === '已繳' || raw === '已繳費') return 'paid';
    if (raw === '未繳' || raw === '到期未繳') return 'unpaid';
    const days = daysLeft(s['課程截止']);
    if (days !== null && days >= 0 && days <= 30) return 'expiring';
    return 'pending';
  }

  const STATUS_LABEL = { paid:'已繳費', unpaid:'未繳費', expiring:'即將到期', pending:'待確認', inactive:'不續班' };
  const STATUS_BADGE = { paid:'badge-paid', unpaid:'badge-unpaid', expiring:'badge-expiring', pending:'badge-pending', inactive:'badge-inactive' };

  // ── API ──
  async function apiGet(params) {
    const qs = Object.entries({ token: adminToken, ...params })
      .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
    const res = await fetch(`${SCRIPT_URL}?${qs}`);
    return res.json();
  }

  // ── 載入 ──
  async function loadStudents() {
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=getStudents&token=${adminToken}`);
      const json = await res.json();
      if (json.status !== 'success') throw new Error(json.message);
      allStudents = json.data;
      document.getElementById('mainView').style.display = 'block';
      initYearTabs();
      renderGrid();
    } catch (err) {
      document.getElementById('tileGrid').innerHTML = `<div class="loading" style="color:#ff3b30">連線失敗<br><br>${err}</div>`;
      document.getElementById('mainView').style.display = 'block';
    }
  }
  window.addEventListener('load', loadStudents);

  // ── 課程分頁切換 ──
  function switchCourseTab(tab) {
    currentTab = tab;
    document.getElementById('ctabMain').classList.toggle('active', tab === 'main');
    document.getElementById('ctabReview').classList.toggle('active', tab === 'review');
    document.getElementById('mainCourseView').style.display   = tab === 'main'   ? '' : 'none';
    document.getElementById('reviewCourseView').style.display = tab === 'review' ? '' : 'none';
    if (tab === 'review' && !reviewLoaded) {
      reviewLoaded = true;
      loadReviewStudents();
    }
    closeDetail();
  }

  // ── 複習班載入 ──
  async function loadReviewStudents() {
    document.getElementById('reviewTileGrid').innerHTML = '<div class="loading">載入中…</div>';
    try {
      const json = await apiGet({ action: 'getReviewStudents' });
      if (json.status !== 'success') throw new Error(json.message);
      allReviewStudents = json.data;
      renderReviewGrid();
      updateReviewStats();
    } catch (err) {
      document.getElementById('reviewTileGrid').innerHTML = `<div class="loading" style="color:#ff3b30">載入失敗<br>${err}</div>`;
    }
  }

  function updateReviewStats() {
    const total  = allReviewStudents.length;
    const paid   = allReviewStudents.filter(s => s['繳費狀態'] === '已繳').length;
    const unpaid = allReviewStudents.filter(s => ['待確認','未繳'].includes(s['繳費狀態'])).length;
    const bio    = allReviewStudents.filter(s => s['班別'] === '生物複習班').length;
    document.getElementById('rStatTotal').textContent  = total;
    document.getElementById('rStatPaid').textContent   = paid;
    document.getElementById('rStatUnpaid').textContent = unpaid;
    document.getElementById('rStatBio').textContent    = bio;
  }

  function setReviewFilter(f, btn) {
    currentReviewFilter = f;
    document.querySelectorAll('#reviewCourseView .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderReviewGrid();
  }

  function renderReviewGrid() {
    const q   = (document.getElementById('reviewSearchInput').value || '').trim().toLowerCase();
    let list  = allReviewStudents;
    if (q) list = list.filter(s => (s['學生姓名']||'').toLowerCase().includes(q));
    if (currentReviewFilter === 'paid')     list = list.filter(s => s['繳費狀態'] === '已繳');
    if (currentReviewFilter === 'unpaid')   list = list.filter(s => ['待確認','未繳'].includes(s['繳費狀態']));
    if (currentReviewFilter === 'inactive') list = list.filter(s => s['繳費狀態'] === '不續班');
    if (currentReviewFilter === 'bio')      list = list.filter(s => s['班別'] === '生物複習班');
    if (currentReviewFilter === 'phy')      list = list.filter(s => s['班別'] === '理化複習班');

    const grid = document.getElementById('reviewTileGrid');
    if (!list.length) { grid.innerHTML = '<div class="loading">沒有符合的學生</div>'; return; }

    grid.innerHTML = list.map(s => {
      const raw    = s['繳費狀態'] || '待確認';
      const status = raw === '不續班' ? 'inactive' : raw === '已繳' ? 'paid' : 'pending';
      const isBio  = s['班別'] === '生物複習班';
      const days   = daysLeft(s['課程截止']);
      const daysHtml = days === null ? '' :
        days < 0   ? `<div class="tile-days expired">已到期</div>` :
        days <= 14 ? `<div class="tile-days soon">剩 ${days} 天</div>` :
                     `<div class="tile-days">剩 ${days} 天</div>`;
      return `<div class="tile status-${status}" onclick="openReviewDetail(${s['id']})">
        <div class="tile-name">${s['學生姓名']||'—'}</div>
        <span class="tile-class-badge ${isBio?'class-bio':'class-phy'}">${isBio?'生物':'理化'}</span><br>
        <span class="tile-tag ${status}">${STATUS_LABEL[status]||raw}</span>
        ${daysHtml}
      </div>`;
    }).join('');
  }

  // ── 開啟複習班詳細 ──
  function openReviewDetail(id) {
    currentReviewId = id;
    const s = allReviewStudents.find(r => r['id'] === id);
    if (!s) return;

    const panel = document.getElementById('detailPanel');
    panel.className = 'detail-panel review-mode';

    const raw    = s['繳費狀態'] || '待確認';
    const status = raw === '不續班' ? 'inactive' : raw === '已繳' ? 'paid' : 'pending';
    document.getElementById('pName').textContent   = s['學生姓名'] || '—';
    document.getElementById('pSchool').textContent = (s['就讀學校']||'') + '　' + (s['年級']||'');
    const badge = document.getElementById('pBadge');
    badge.textContent  = STATUS_LABEL[status] || raw;
    badge.className    = `status-badge ${STATUS_BADGE[status] || ''}`;

    document.getElementById('pPhone').textContent   = s['聯絡方式'] || '—';
    document.getElementById('pAddress').textContent = s['地址'] || '—';
    document.getElementById('pLine').textContent    = '';

    // 複習班資料
    const isBio = s['班別'] === '生物複習班';
    document.getElementById('rClass').innerHTML  = `<span class="tile-class-badge ${isBio?'class-bio':'class-phy'}" style="font-size:13px">${s['班別']||'—'}</span>`;
    document.getElementById('rMember').textContent  = s['身份'] || '—';
    document.getElementById('rFee').textContent     = s['費用'] ? `$${Number(s['費用']).toLocaleString()}` : '—';
    document.getElementById('rDateRange').textContent = `${fmtYM(s['課程開始'])} ～ ${fmtYM(s['課程截止'])}`;

    // 預填繳費日期
    document.getElementById('payDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('payAmount').value = s['費用'] || '';
    document.getElementById('netAmountDisplay').style.display = 'none';

    ['payForm', 'renewForm', 'scoreForm'].forEach(f => {
      const el = document.getElementById(f);
      if (el) el.classList.add('hidden');
    });

    // 繳費紀錄 for review: simple paid/unpaid display
    const histEl = document.getElementById('payHistory');
    if (s['繳費狀態'] === '已繳') {
      const dt = s['繳費日期'] ? String(s['繳費日期']).slice(0,10) : '—';
      histEl.innerHTML = `<div class="hist-row"><div><div class="hist-date">${dt}</div><div class="hist-plan">${s['班別']}</div></div><span class="hist-status badge-paid">已繳費</span></div>`;
    } else {
      histEl.innerHTML = '<div style="color:#8e8e93;font-size:13px">尚未繳費</div>';
    }

    document.getElementById('detailPanel').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }

  // ── 不續班（通用）──
  function handleInactive() {
    if (currentTab === 'review') doMarkReviewInactive();
    else doMarkInactive();
  }

  async function doMarkReviewInactive() {
    if (!currentReviewId) return;
    if (!confirm('確定標記為不續班？')) return;
    const json = await apiGet({ action: 'markReviewInactive', student_id: currentReviewId });
    if (json.status === 'success') {
      const s = allReviewStudents.find(r => r['id'] === currentReviewId);
      if (s) s['繳費狀態'] = '不續班';
      renderReviewGrid();
      closeDetail();
    }
  }

  // ── 年度分頁 ──
  function initYearTabs() {
    const years = [...new Set(allStudents.map(s => s['學費年度']))].sort().reverse();
    if (!years.length) return;
    currentYear = years[0];
    const c = document.getElementById('yearTabs');
    c.innerHTML = '';
    years.forEach(year => {
      const btn = document.createElement('button');
      btn.className = 'year-tab' + (year === currentYear ? ' active' : '');
      btn.textContent = year + '年度';
      btn.onclick = () => {
        currentYear = year;
        document.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      };
      c.appendChild(btn);
    });
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  // ── 渲染磁磚 ──
  function renderGrid() {
    const keyword  = document.getElementById('searchInput').value.toLowerCase();
    const year     = allStudents.filter(s => s['學費年度'] === currentYear);
    const filtered = year.filter(s => {
      if (keyword) {
        const hay = (s['學生姓名'] + s['就讀學校'] + (s['地址'] || '')).toLowerCase();
        if (!hay.includes(keyword)) return false;
      }
      return currentFilter === 'all' || getStatus(s) === currentFilter;
    });

    let paid = 0, unpaid = 0, expiring = 0;
    year.forEach(s => {
      const st = getStatus(s);
      if (st === 'paid')     paid++;
      if (st === 'unpaid')   unpaid++;
      if (st === 'expiring') expiring++;
    });
    document.getElementById('statTotal').textContent    = year.filter(s => getStatus(s) !== 'inactive').length;
    document.getElementById('statPaid').textContent     = paid;
    document.getElementById('statUnpaid').textContent   = unpaid;
    document.getElementById('statExpiring').textContent = expiring;

    const grid = document.getElementById('tileGrid');
    grid.innerHTML = '';
    if (!filtered.length) {
      grid.innerHTML = '<div class="loading">沒有符合條件的學生</div>';
      return;
    }

    filtered.forEach(s => {
      const st   = getStatus(s);
      const days = daysLeft(s['課程截止']);
      let daysHtml = '';
      if (st !== 'inactive' && days !== null) {
        if (days < 0)      daysHtml = `<div class="tile-days expired">已到期</div>`;
        else if (days <= 7) daysHtml = `<div class="tile-days soon">剩 ${days} 天</div>`;
        else               daysHtml = `<div class="tile-days">剩 ${days} 天</div>`;
      }
      const tile = document.createElement('div');
      tile.className = `tile status-${st}`;
      tile.onclick   = () => openDetail(s['id']);
      tile.innerHTML = `
        <div class="tile-name">${s['學生姓名']}</div>
        <div class="tile-tag ${st}">${STATUS_LABEL[st]}</div>
        ${daysHtml}
      `;
      grid.appendChild(tile);
    });
  }

  // ── 詳細面板 ──
  async function openDetail(id) {
    const s = allStudents.find(s => s['id'] === id);
    if (!s) return;
    currentStudentId = id;
    currentScholarship = 0;
    document.getElementById('detailPanel').className = 'detail-panel main-mode';

    const st = getStatus(s);
    document.getElementById('pName').textContent      = s['學生姓名'];
    document.getElementById('pSchool').textContent    = `${s['就讀學校']}${s['年級'] ? ' · ' + s['年級'] : ''}`;
    document.getElementById('pPhone').textContent     = s['家長電話'] || '—';
    document.getElementById('pAddress').textContent   = s['地址'] || '—';
    document.getElementById('pLine').textContent      = s['LINE ID'] || '—';
    document.getElementById('pPlan').textContent      = s['課程方案'] || '—';
    document.getElementById('pDateRange').textContent = `${fmtYM(s['課程開始'])} ～ ${fmtYM(s['課程截止'])}`;

    const badge = document.getElementById('pBadge');
    badge.textContent = STATUS_LABEL[st];
    badge.className   = `status-badge ${STATUS_BADGE[st]}`;

    // 預填繳費表單
    document.getElementById('payDate').value   = new Date().toISOString().split('T')[0];
    document.getElementById('payAmount').value = s['月費金額'] || '';
    document.getElementById('payDeduction').value = '';
    document.getElementById('netAmountDisplay').style.display = 'none';

    // 預填更新學期
    const endVal = s['課程截止'];
    if (endVal) {
      const endD = new Date(endVal);
      if (!isNaN(endD)) {
        endD.setMonth(endD.getMonth() + 1);
        document.getElementById('renewStart').value = endD.getFullYear() + '-' + String(endD.getMonth() + 1).padStart(2, '0');
      }
    }
    const plan = s['課程方案'] || '';
    const sel  = document.getElementById('renewPlan');
    let matched = false;
    for (let opt of sel.options) {
      if (opt.value === plan) { sel.value = plan; matched = true; break; }
    }
    if (!matched) { sel.value = 'custom'; document.getElementById('customPlan').value = plan; document.getElementById('customPlanRow').style.display = 'block'; }
    else { document.getElementById('customPlanRow').style.display = 'none'; }
    calcRenewEnd();

    // 清空成績表單
    document.getElementById('scoreExamName').value = '';
    document.getElementById('scorePrev').value     = '';
    document.getElementById('scoreCurrent').value  = '';
    document.getElementById('scholarshipPreview').style.display = 'none';

    // 隱藏子表單
    ['payForm', 'renewForm', 'scoreForm'].forEach(f => document.getElementById(f).classList.add('hidden'));

    document.getElementById('detailPanel').classList.add('open');
    document.getElementById('overlay').classList.add('show');

    // 載入獎學金、成績、繳費紀錄
    loadScholarshipBalance(id);
    loadScoreHistory(id);
    loadPayHistory(id);
  }

  function closeDetail() {
    document.getElementById('detailPanel').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
    currentStudentId = null;
  }

  function toggleForm(formId) {
    ['payForm', 'renewForm', 'scoreForm'].filter(f => f !== formId)
      .forEach(f => document.getElementById(f).classList.add('hidden'));
    document.getElementById(formId).classList.toggle('hidden');
  }

  // ── 獎學金餘額 ──
  async function loadScholarshipBalance(id) {
    document.getElementById('pScholarship').textContent = '—';
    try {
      const json = await apiGet({ action: 'getScholarshipBalance', student_id: id });
      if (json.status === 'success') {
        currentScholarship = (json.data && json.data.balance) || 0;
        document.getElementById('pScholarship').textContent = currentScholarship > 0 ? `$${currentScholarship.toLocaleString()}` : '$0';
        // 顯示折抵欄位
        if (currentScholarship > 0) {
          document.getElementById('scholarshipRow').style.display = 'block';
          document.getElementById('payScholarshipAvail').textContent = currentScholarship.toLocaleString();
        } else {
          document.getElementById('scholarshipRow').style.display = 'none';
        }
      }
    } catch(e) {}
  }

  // ── 成績預覽 ──
  function previewScholarship() {
    const cur  = parseInt(document.getElementById('scoreCurrent').value);
    const prev = document.getElementById('scorePrev').value;
    const div  = document.getElementById('scholarshipPreview');
    if (isNaN(cur)) { div.style.display = 'none'; return; }
    const earned = calcScholarshipAmount(cur, prev !== '' ? parseInt(prev) : null);
    if (earned > 0) {
      div.textContent = `🎉 獲得獎學金 $${earned}`;
      div.style.display = 'block';
    } else {
      div.style.display = 'none';
    }
  }

  function calcScholarshipAmount(cur, prev) {
    const candidates = [];
    if (cur === 100) candidates.push(500);
    if (cur >= 90)   candidates.push(300);
    if (prev !== null && !isNaN(prev) && (cur - prev) >= 20) candidates.push(200);
    return candidates.length > 0 ? Math.max(...candidates) : 0;
  }

  // ── 新增成績 ──
  async function doAddScore() {
    const exam    = document.getElementById('scoreExamName').value.trim();
    const cur     = parseInt(document.getElementById('scoreCurrent').value);
    const prevRaw = document.getElementById('scorePrev').value;
    const prev    = prevRaw !== '' ? parseInt(prevRaw) : '';
    if (!exam || isNaN(cur)) return alert('請填入考試名稱和當次成績');

    const btn = document.getElementById('scoreSubmit');
    btn.disabled = true; btn.textContent = '儲存中…';

    const json = await apiGet({ action: 'addScore', student_id: currentStudentId, exam_name: exam, current_score: cur, prev_score: prev });
    if (json.status === 'success') {
      document.getElementById('scoreForm').classList.add('hidden');
      loadScholarshipBalance(currentStudentId);
      loadScoreHistory(currentStudentId);
    } else {
      alert('儲存失敗：' + (json.message || '請重試'));
    }
    btn.disabled = false; btn.textContent = '確認新增';
  }

  // ── 成績紀錄 ──
  async function loadScoreHistory(id) {
    const div = document.getElementById('scoreHistory');
    try {
      const json = await apiGet({ action: 'getScoreHistory', student_id: id });
      if (!json.data || !json.data.length) {
        div.innerHTML = '<div style="color:#8e8e93;font-size:13px">尚無成績紀錄</div>';
        return;
      }
      div.innerHTML = json.data.map(r => {
        const prev = r['前次成績'] !== '' && r['前次成績'] !== null ? `${r['前次成績']}→` : '';
        const imp  = r['進步分數'] > 0 ? ` <span style="color:#34c759;font-size:11px">+${r['進步分數']}分</span>` : '';
        const earn = r['獲得獎學金'] > 0 ? `<span class="scholarship-earn">+$${r['獲得獎學金']}</span>` : '<span style="color:#8e8e93">—</span>';
        return `
          <div class="hist-row">
            <div>
              <div class="hist-date">${r['考試名稱']}</div>
              <div class="hist-plan">${prev}${r['當次成績']}分${imp}</div>
            </div>
            ${earn}
          </div>
        `;
      }).join('');
    } catch(e) {
      div.innerHTML = '<div style="color:#8e8e93;font-size:13px">需更新後台才能載入</div>';
    }
  }

  // ── 領現金 ──
  async function doCashOut() {
    if (currentScholarship <= 0) return alert('目前沒有可用獎學金');
    const input = prompt(`領取現金獎學金\n目前餘額：$${currentScholarship.toLocaleString()}\n\n輸入領取金額：`);
    if (!input) return;
    const amount = parseInt(input);
    if (isNaN(amount) || amount <= 0) return alert('請輸入有效金額');
    if (amount > currentScholarship)  return alert(`超過可用餘額（$${currentScholarship}）`);

    const json = await apiGet({ action: 'useScholarship', student_id: currentStudentId, amount, type: '領現' });
    if (json.status === 'success') {
      loadScholarshipBalance(currentStudentId);
    } else {
      alert('操作失敗：' + (json.message || ''));
    }
  }

  // ── 更新金額顯示 ──
  function updateNetAmount() {
    const tuition   = parseInt(document.getElementById('payAmount').value)    || 0;
    const deduction = parseInt(document.getElementById('payDeduction').value) || 0;
    const net = Math.max(0, tuition - deduction);
    document.getElementById('netAmount').textContent = `$${net.toLocaleString()}`;
    document.getElementById('netAmountDisplay').style.display = deduction > 0 ? 'block' : 'none';
  }

  // ── 記錄繳費 ──
  async function doRecordPayment() {
    const date   = document.getElementById('payDate').value;
    const amount = parseInt(document.getElementById('payAmount').value) || 0;
    if (!date) return alert('請填入繳費日期');

    const btn = document.getElementById('paySubmit');
    btn.disabled = true; btn.textContent = '儲存中…';

    try {
      if (currentTab === 'review') {
        // 複習班繳費
        const json = await apiGet({ action: 'recordReviewPayment', student_id: currentReviewId, payment_date: date, amount });
        if (json.status !== 'success') throw new Error(json.message || '繳費記錄失敗');
        const s = allReviewStudents.find(r => r['id'] === currentReviewId);
        if (s) { s['繳費狀態'] = '已繳'; s['繳費日期'] = date; }
        renderReviewGrid();
        updateReviewStats();
        document.getElementById('pBadge').textContent = '已繳費';
        document.getElementById('pBadge').className   = 'status-badge badge-paid';
        document.getElementById('payForm').classList.add('hidden');
        // 更新 panel 繳費紀錄
        document.getElementById('payHistory').innerHTML = `<div class="hist-row"><div><div class="hist-date">${date}</div></div><span class="hist-status badge-paid">已繳費</span></div>`;
      } else {
        // 進度班繳費（含獎學金折抵）
        const deduction = parseInt(document.getElementById('payDeduction').value) || 0;
        if (deduction > currentScholarship) return alert(`折抵金額超過可用獎學金（$${currentScholarship}）`);
        if (deduction > 0) {
          const useJson = await apiGet({ action: 'useScholarship', student_id: currentStudentId, amount: deduction, type: '折抵' });
          if (useJson.status !== 'success') throw new Error(useJson.message || '折抵失敗');
        }
        const net  = Math.max(0, amount - deduction);
        const json = await apiGet({ action: 'recordPayment', student_id: currentStudentId, payment_date: date, amount: net });
        if (json.status !== 'success') throw new Error(json.message || '繳費記錄失敗');
        const s = allStudents.find(s => s['id'] === currentStudentId);
        if (s) s['繳費狀態'] = '已繳';
        renderGrid();
        document.getElementById('pBadge').textContent = '已繳費';
        document.getElementById('pBadge').className   = 'status-badge badge-paid';
        document.getElementById('payForm').classList.add('hidden');
        loadScholarshipBalance(currentStudentId);
        loadPayHistory(currentStudentId);
      }
    } catch(e) {
      alert('儲存失敗：' + e.message);
    }
    btn.disabled = false; btn.textContent = '確認已繳費';
  }

  // ── 繳費紀錄 ──
  async function loadPayHistory(id) {
    const div = document.getElementById('payHistory');
    div.innerHTML = '<div style="color:#8e8e93;font-size:13px">載入中…</div>';
    try {
      const json = await apiGet({ action: 'getStudentHistory', student_id: id });
      if (json.status !== 'success') throw new Error(json.message);
      if (!json.data.length) {
        div.innerHTML = '<div style="color:#8e8e93;font-size:13px">尚無繳費紀錄</div>';
        return;
      }
      div.innerHTML = json.data.map(h => {
        const sc = h['狀態'] === '已繳' ? 'badge-paid' : 'badge-pending';
        return `
          <div class="hist-row">
            <div>
              <div class="hist-date">${h['繳費月份'] || '—'}</div>
              <div class="hist-plan">${h['學費年度'] ? h['學費年度'] + '年度' : ''}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:600">${h['金額'] ? '$' + Number(h['金額']).toLocaleString() : '—'}</div>
              <span class="hist-status ${sc}">${h['狀態']}</span>
            </div>
          </div>
        `;
      }).join('');
    } catch(e) {
      div.innerHTML = `<div style="color:#ff3b30;font-size:12px">載入失敗：${e.message}</div>`;
    }
  }

  // ── 更新學期 ──
  function onPlanChange() {
    const v = document.getElementById('renewPlan').value;
    document.getElementById('customPlanRow').style.display = v === 'custom' ? 'block' : 'none';
    calcRenewEnd();
  }

  function calcRenewEnd() {
    const plan  = document.getElementById('renewPlan').value;
    const start = document.getElementById('renewStart').value;
    if (!start) return;
    const months = plan.startsWith('四個月') ? 4 : plan.startsWith('六個月') ? 6 : 0;
    if (months > 0) {
      const [y, m] = start.split('-').map(Number);
      // 3月起4個月 = 3,4,5,6月 → 結束 6月 → m-1+months-1 = m+months-2
      const end = new Date(y, m + months - 2, 1);
      document.getElementById('renewEnd').value = end.getFullYear() + '-' + String(end.getMonth() + 1).padStart(2, '0');
    }
  }

  async function doUpdatePeriod() {
    const planSel = document.getElementById('renewPlan').value;
    const plan    = planSel === 'custom' ? document.getElementById('customPlan').value.trim() : planSel;
    const start   = document.getElementById('renewStart').value;
    const end     = document.getElementById('renewEnd').value;
    if (!plan || !start || !end) return alert('請填入完整資料');

    const btn = document.getElementById('renewSubmit');
    btn.disabled = true; btn.textContent = '儲存中…';

    const json = await apiGet({ action: 'updatePeriod', student_id: currentStudentId, course_plan: plan, start_date: start, end_date: end });
    if (json.status === 'success') {
      const s = allStudents.find(s => s['id'] === currentStudentId);
      if (s) { s['課程方案'] = plan; s['課程開始'] = start; s['課程截止'] = end; s['繳費狀態'] = '待確認'; }
      document.getElementById('pPlan').textContent      = plan;
      document.getElementById('pDateRange').textContent = `${fmtYM(start)} ～ ${fmtYM(end)}`;
      document.getElementById('pBadge').textContent     = '待確認';
      document.getElementById('pBadge').className       = 'status-badge badge-pending';
      renderGrid();
      document.getElementById('renewForm').classList.add('hidden');
    } else {
      alert('儲存失敗：' + (json.message || '請重試'));
    }
    btn.disabled = false; btn.textContent = '儲存學期';
  }

  // ── 不續班 ──
  async function doMarkInactive() {
    const s = allStudents.find(s => s['id'] === currentStudentId);
    if (!confirm(`確定將 ${s?.['學生姓名'] || '此學生'} 標記為不續班？`)) return;
    const json = await apiGet({ action: 'markInactive', student_id: currentStudentId });
    if (json.status === 'success') {
      if (s) s['繳費狀態'] = '不續班';
      renderGrid();
      closeDetail();
    } else {
      alert('操作失敗：' + (json.message || ''));
    }
  }

  // ══════════════════════════════════════════
  // 批次匯入成績
  // ══════════════════════════════════════════

  function openImportModal() {
    document.getElementById('importModal').classList.add('show');
    document.getElementById('importFile').value       = '';
    document.getElementById('importExamName').value   = '';
    document.getElementById('importColSettings').style.display = 'none';
    document.getElementById('importPreview').innerHTML = '';
    document.getElementById('importSubmit').style.display = 'none';
    _importRows = [];
  }

  function closeImportModal() {
    document.getElementById('importModal').classList.remove('show');
  }

  function onImportOverlayClick(e) {
    if (e.target === document.getElementById('importModal')) closeImportModal();
  }

  function parseImportFile() {
    const file = document.getElementById('importFile').files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const wb      = XLSX.read(e.target.result, { type: 'array' });
      const sheet   = wb.Sheets[wb.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (rawRows.length < 2) return alert('檔案內容太少，請確認格式');

      const headers = rawRows[0].map(String);
      _importRows   = rawRows.slice(1).filter(r => r.some(c => c !== ''));

      // 填入欄位選單
      ['colName', 'colCurrent', 'colPrev'].forEach(id => {
        const sel = document.getElementById(id);
        const prevVal = sel.value;
        sel.innerHTML = id === 'colPrev' ? '<option value="">不選</option>' : '';
        headers.forEach((h, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = h || `欄 ${i + 1}`;
          // 自動猜測
          if (id === 'colName'    && (h.includes('姓名') || h.includes('名字')))    opt.selected = true;
          if (id === 'colCurrent' && h.includes('二段'))                              opt.selected = true;
          if (id === 'colPrev'    && h.includes('一段'))                              opt.selected = true;
          sel.appendChild(opt);
        });
      });

      document.getElementById('importColSettings').style.display = 'block';
      showImportPreview();
    };
    reader.readAsArrayBuffer(file);
  }

  function showImportPreview() {
    if (!_importRows.length) return;
    const nameCol    = parseInt(document.getElementById('colName').value);
    const curCol     = parseInt(document.getElementById('colCurrent').value);
    const prevColVal = document.getElementById('colPrev').value;
    const prevCol    = prevColVal !== '' ? parseInt(prevColVal) : null;

    const processed = _importRows.map(row => {
      const name    = String(row[nameCol] || '').trim();
      const cur     = parseFloat(row[curCol]);
      const prev    = prevCol !== null ? parseFloat(row[prevCol]) : null;
      const matched = allStudents.find(s => s['學生姓名'] === name);
      const scholarship = !isNaN(cur) ? calcScholarshipAmount(cur, prev !== null && !isNaN(prev) ? prev : null) : 0;
      return { name, cur, prev, matched: !!matched, matchedId: matched?.['id'], scholarship };
    }).filter(r => r.name);

    const matchCount = processed.filter(r => r.matched).length;

    document.getElementById('importPreview').innerHTML = `
      <div style="font-size:12px;color:#6c6c70;margin:10px 0 6px">${processed.length} 筆　匹配成功 ${matchCount} 筆　未匹配 ${processed.length - matchCount} 筆</div>
      <div class="preview-table-wrap">
        <table class="preview-table">
          <tr>
            <th>姓名</th><th>前次</th><th>當次</th><th>進步</th><th>獎學金</th><th>狀態</th>
          </tr>
          ${processed.map(r => {
            const imp = (r.prev !== null && !isNaN(r.prev) && !isNaN(r.cur)) ? r.cur - r.prev : null;
            return `
              <tr class="${!r.matched ? 'no-match' : ''}">
                <td>${r.name}</td>
                <td style="text-align:center">${r.prev !== null && !isNaN(r.prev) ? r.prev : '—'}</td>
                <td style="text-align:center;font-weight:600">${!isNaN(r.cur) ? r.cur : '—'}</td>
                <td style="text-align:center;color:${imp >= 20 ? '#34c759' : '#8e8e93'}">${imp !== null ? (imp > 0 ? '+' + imp : imp) : '—'}</td>
                <td style="text-align:right;color:#34c759;font-weight:700">${r.scholarship > 0 ? '+$' + r.scholarship : '—'}</td>
                <td style="text-align:center"><span class="${r.matched ? 'match-ok' : 'match-err'}">${r.matched ? '✓' : '未匹配'}</span></td>
              </tr>
            `;
          }).join('')}
        </table>
      </div>
    `;

    window._importPreview = processed;
    const btn = document.getElementById('importSubmit');
    btn.style.display   = matchCount > 0 ? 'block' : 'none';
    btn.textContent     = `確認匯入 ${matchCount} 筆`;
  }

  async function doImport() {
    const examName = document.getElementById('importExamName').value.trim();
    if (!examName) return alert('請填入考試名稱');

    const toImport = (window._importPreview || []).filter(r => r.matched).map(r => ({
      id:   r.matchedId,
      cur:  r.cur,
      prev: r.prev !== null && !isNaN(r.prev) ? r.prev : ''
    }));
    if (!toImport.length) return;

    const btn = document.getElementById('importSubmit');
    btn.disabled = true; btn.textContent = '匯入中…';

    // 分批每次 20 筆
    const batchSize = 20;
    let success = true;
    for (let i = 0; i < toImport.length; i += batchSize) {
      const batch = toImport.slice(i, i + batchSize);
      const json  = await apiGet({
        action:    'importScores',
        exam_name: examName,
        scores:    JSON.stringify(batch)
      });
      if (json.status !== 'success') { alert('匯入失敗：' + (json.message || '')); success = false; break; }
    }

    if (success) {
      alert(`✅ 已匯入 ${toImport.length} 筆成績！`);
      closeImportModal();
    }
    btn.disabled = false; btn.textContent = `確認匯入 ${toImport.length} 筆`;
  }
</script>
