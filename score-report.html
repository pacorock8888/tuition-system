<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成績回報｜Paco 線上班</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182536;font:16px/1.65 -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:640px;margin:36px auto;padding:32px;background:white;border-radius:20px;box-shadow:0 8px 32px #18253609}h1{font-size:29px;line-height:1.35;margin:10px 0}h2{font-size:21px}.brand{font-weight:750;color:#1261cc;font-size:14px;letter-spacing:1px}.muted,small{color:#697789}small{display:block;font-size:13px;margin:6px 0}.intro{border-bottom:1px solid #e8ecf1;padding-bottom:20px;margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:650;font-size:15px;margin:17px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd3df;border-radius:10px;padding:12px;font:inherit;background:white;color:#182536}input::placeholder,textarea::placeholder{color:#8a94a3;font-size:14px}input:focus,select:focus,textarea:focus{outline:2px solid #3281ef;outline-offset:1px}.req{color:#cd3f37}.box{background:#f6f8fb;border-radius:12px;padding:4px 18px 15px;margin:20px 0}.box p{font-size:14px;margin:8px 0}.error{color:#b82f28;font-size:14px;min-height:0;margin-top:5px}[aria-invalid=true]{border-color:#b82f28}button{width:100%;border:0;border-radius:11px;background:#0878ed;color:white;font:700 17px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;padding:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}[hidden]{display:none!important}.success{text-align:center;padding:40px 0}.check{display:inline-grid;place-items:center;background:#e1f6e9;color:#178447;border-radius:50%;width:66px;height:66px;font-size:34px}@media(max-width:600px){main{margin:0;border-radius:0;padding:24px 20px;min-height:100vh}.row{gap:12px}h1{font-size:26px}} 
</style></head><body><main><div class="brand">PACO 線上班</div><div class="intro"><h1 id="examTitle">成績回報</h1><div class="muted" id="examSubtitle">正在確認回報連結…</div></div><form id="scoreForm" novalidate hidden>
<small>標示 <span class="req">＊</span> 為必填。請填阿拉伯數字，可填小數，例如 92.5。</small>
<div class="row"><div><label for="name">學生姓名 <span class="req">＊</span></label><input id="name" autocomplete="name" placeholder="請填學生全名，例如：王小明" maxlength="50"><div id="nameError" class="error"></div></div><div><label for="school">就讀學校 <span class="req">＊</span></label><input id="school" placeholder="例如：協同、復興" maxlength="100"><small>只填校名，不用加縣市、國中或中學。</small><div id="schoolError" class="error"></div></div></div>
<div class="row"><div><label for="current">理化成績 <span class="req">＊</span></label><input id="current" inputmode="decimal" placeholder="例如：90 或 92.5"><div id="currentError" class="error"></div></div><div><label for="earth">地科成績（獨立考用）</label><input id="earth" inputmode="decimal" placeholder="例如：85"><div id="earthError" class="error"></div></div></div>
<div class="box"><label for="baseline">前次段考成績（選填）</label><input id="baseline" inputmode="decimal" placeholder="例如：70；不確定可留空"><div id="baselineError" class="error"></div><small>已有前次紀錄時，以老師確認的成績為準。</small></div>
<label for="reflection">想對自己說的話（選填）</label><textarea id="reflection" rows="2" maxlength="2000"></textarea>
<label for="encouragement">想對 Paco 老師說的話或鼓勵（選填）</label><textarea id="encouragement" rows="2" maxlength="2000"></textarea>
<label for="suggestion">對課程或社群的建議（選填）</label><textarea id="suggestion" rows="2" maxlength="2000"></textarea>
<div class="box"><p>100 分：500 元 · 90 分以上：300 元<br>進步至少 20 分：200 元</p><small>每次只取最高一項獎金，經老師確認後登記。</small></div>
<div id="submitError" class="error" role="alert"></div><button id="submitButton" type="submit">送出成績</button><small style="text-align:center">不需登入 Google 帳號</small></form>
<section id="success" class="success" hidden><div class="check">✓</div><h2>成績已收到，謝謝！</h2><p class="muted" id="receipt">老師確認後會登記成績與獎學金。</p><small>如需更正，請直接聯繫老師，不必重複填寫。</small></section><p id="pageError" class="error" role="alert"></p></main>
<script>
const SCORE_URL='https://script.google.com/macros/s/AKfycbw7D_7xj3xe3S_ejL58oOGO2AMc70gMXBAtgbnkmrKqsPL3KxMaz9IlyFk6jMPyBjKRmQ/exec';
const token=new URLSearchParams(location.search).get('exam')||'';
const el=id=>document.getElementById(id);
async function requestScore(action,fields={}){if(window.scorePreviewTransport)return window.scorePreviewTransport(action,{token,...fields});const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),30000);try{const res=await fetch(SCORE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({form_type:'score',action,token,...fields}),signal:ctrl.signal});if(!res.ok)throw Error('連線暫時失敗，請稍後再試。');const j=await res.json();if(j.status!=='success')throw Error(j.message||'未完成送出，請稍後重試。');return j.data;}finally{clearTimeout(timer);}}
function fieldError(id,msg){el(id+'Error').textContent=msg;el(id).setAttribute('aria-invalid',String(!!msg));}
function scoreNumber(id,optional){const value=el(id).value.normalize('NFKC').trim();el(id).value=value;if(!value&&optional)return '';if(!/^\d{1,3}(\.\d{1,2})?$/.test(value)||Number(value)>100){fieldError(id,'請填 0～100 的數字，例如 92.5。');throw Error('invalid');}return value;}
el('scoreForm').addEventListener('submit',async event=>{event.preventDefault();if(el('submitButton').disabled)return;['name','school','current','earth','baseline'].forEach(id=>fieldError(id,''));el('submitError').textContent='';const data={name:el('name').value.normalize('NFKC').trim(),school:el('school').value.normalize('NFKC').trim(),reflection:el('reflection').value,encouragement:el('encouragement').value,suggestion:el('suggestion').value};let invalid=false;if(!data.name){fieldError('name','請填學生完整姓名。');invalid=true;}if(!data.school){fieldError('school','請填校名，例如：協同、復興。');invalid=true;}for(const id of ['current','earth','baseline']){try{data[id]=scoreNumber(id,id!=='current');}catch(e){invalid=true;}}if(invalid){document.querySelector('[aria-invalid=true]').focus();return;}el('submitButton').disabled=true;el('submitButton').textContent='正在送出…';try{const result=await requestScore('submit',data);if(!result.received)throw Error('尚未確認收到資料，請稍後重試。');el('scoreForm').hidden=true;el('success').hidden=false;if(result.duplicate)el('receipt').textContent='這次成績已經收到，不會重複登記。';window.scrollTo(0,0);}catch(e){el('submitError').textContent=e.name==='AbortError'?'連線較久，尚未確認結果。內容已保留，可以再次送出，不會重複登記。':e.message.replace(/^Error:\s*/,'');}finally{el('submitButton').disabled=false;el('submitButton').textContent='送出成績';}});
(async()=>{try{const info=await requestScore('publicInfo');el('examTitle').textContent=info.name;el('examSubtitle').textContent=info.year+' 年度｜考試成績回報';el('scoreForm').hidden=false;}catch(e){el('examSubtitle').textContent='目前無法開啟回報表';el('pageError').textContent='請確認使用老師提供的完整連結，或稍後重新整理。';}})();
</script></body></html>
